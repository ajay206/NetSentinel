[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ns-common"
version = "0.1.0"
description = "NetSentinel shared common library"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "confluent-kafka>=2.4.0",
    "pydantic>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ns_common"]
