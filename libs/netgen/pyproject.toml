[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netgen"
version = "0.1.0"
description = "Synthetic telecom topology and alarm generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/netgen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
