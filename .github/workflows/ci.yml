name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter check
        run: uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest

      - name: No direct LLM calls outside llm-gateway (Step 18)
        run: python3 scripts/check_llm_calls.py

  console:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            console:
              - 'apps/noc-console/**'

      - name: Set up Node
        if: steps.filter.outputs.console == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        if: steps.filter.outputs.console == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/noc-console/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.filter.outputs.console == 'true'
        run: npm ci
        working-directory: apps/noc-console

      - name: Lint
        if: steps.filter.outputs.console == 'true'
        run: npm run lint
        working-directory: apps/noc-console

      - name: Typecheck
        if: steps.filter.outputs.console == 'true'
        run: npm run typecheck
        working-directory: apps/noc-console

      - name: Test
        if: steps.filter.outputs.console == 'true'
        run: npm test
        working-directory: apps/noc-console

      - name: Build
        if: steps.filter.outputs.console == 'true'
        run: npm run build
        working-directory: apps/noc-console
