name: images

# W24: build every service image and push it to GHCR on merge to main (and on v* tags).
# PRs only build (no push) when a Dockerfile or service changes. Uses GITHUB_TOKEN only.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    paths:
      - 'services/**'
      - 'libs/**'
      - 'apps/noc-console/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: api-gateway, context: ., file: services/api-gateway/Dockerfile}
          - {name: alarm-ingest, context: ., file: services/alarm-ingest/Dockerfile}
          - {name: kpi-service, context: ., file: services/kpi-service/Dockerfile}
          - {name: ml-service, context: ., file: services/ml-service/Dockerfile}
          - {name: rag-service, context: ., file: services/rag-service/Dockerfile}
          - {name: copilot-orchestrator, context: ., file: services/copilot-orchestrator/Dockerfile}
          - {name: mcp-server, context: ., file: services/mcp-server/Dockerfile}
          - {name: incident-service, context: ., file: services/incident-service/Dockerfile}
          - {name: topology-service, context: ., file: services/topology-service/Dockerfile}
          - {name: ticket-service, context: ., file: services/ticket-service/Dockerfile}
          - {name: llm-gateway, context: ., file: services/llm-gateway/Dockerfile}
          - {name: netgen-simulator, context: ., file: services/netgen-simulator/Dockerfile}
          - {name: noc-console, context: apps/noc-console, file: apps/noc-console/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/netsentinel-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
