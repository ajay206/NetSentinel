openapi: 3.1.0
info:
  title: NetSentinel ml-service
  version: 0.1.0
  description: >-
    Statistical anomaly baselines (W6): seasonal decomposition + robust z-score + CUSUM over
    15-minute KPI series read from kpi-service. Reached from the console via api-gateway /api/ml/*.
servers:
  - url: http://localhost:8003
paths:
  /healthz:
    get:
      responses:
        '200': {description: Process is alive}
  /readyz:
    get:
      responses:
        '200': {description: kpi-service reachable}
        '503': {description: kpi-service unavailable}
  /anomalies:
    get:
      summary: Top anomalies across up to 20 cells
      parameters:
        - $ref: '#/components/parameters/kpi'
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 1440, default: 24}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Anomalies sorted by score (desc), then time (desc)
          content:
            application/json:
              schema:
                type: object
                required: [kpi, hours, items]
                properties:
                  kpi: {type: string}
                  hours: {type: integer}
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Anomaly'
                        - type: object
                          required: [cellId, region]
                          properties:
                            cellId: {type: string}
                            region: {type: string}
        '422': {description: Unknown KPI or hours out of range}
        '502': {description: kpi-service error}
  /anomalies/cells/{cellId}:
    get:
      summary: Anomalies for one cell (baseline learned from up to 7 days)
      parameters:
        - {name: cellId, in: path, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/kpi'
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 1440, default: 168}}
      responses:
        '200':
          description: Anomalies within the requested window
          content:
            application/json:
              schema:
                type: object
                required: [cellId, kpi, from, to, threshold, points, anomalies]
                properties:
                  cellId: {type: string}
                  kpi: {type: string}
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  threshold: {type: number, description: robust z threshold (ANOMALY_Z)}
                  points: {type: integer, description: number of 15-min points analysed}
                  anomalies:
                    type: array
                    items: {$ref: '#/components/schemas/Anomaly'}
        '404': {description: Unknown cell or no data}
        '422': {description: Unknown KPI or hours out of range}
        '502': {description: kpi-service error}
  /predict:
    post:
      summary: Classify the likely fault type of an enriched alarm (W7, XGBoost)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FaultRequest'}
      responses:
        '200':
          description: Prediction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FaultPrediction'}
        '422': {description: Invalid body}
        '503': {description: No model registered and AUTO_TRAIN=0}
  /explain:
    post:
      summary: TreeSHAP explanation (top-k feature contributions) for the predicted class
      parameters:
        - {name: top_k, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 5}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FaultRequest'}
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FaultExplanation'}
        '422': {description: Invalid body}
        '503': {description: No model registered and AUTO_TRAIN=0}
components:
  parameters:
    kpi:
      name: kpi
      in: query
      schema:
        type: string
        enum: [dlThroughputMbps, prbUtilPct, rrcSetupSuccessPct, dropCallRatePct, availabilityPct]
        default: dlThroughputMbps
  schemas:
    Anomaly:
      type: object
      required: [ts, value, score, method, direction]
      properties:
        ts: {type: string, format: date-time}
        value: {type: number}
        score: {type: number, description: absolute robust z-score of the residual}
        method: {type: string, enum: [zscore, cusum, both]}
        direction: {type: string, enum: [high, low]}
    FaultRequest:
      type: object
      required: [alarm]
      properties:
        alarm: {type: object, description: Enriched alarm (see alarm-enriched schema); label fields are ignored}
        context: {type: [object, 'null'], description: Optional KPI/topology context}
    FaultPrediction:
      type: object
      required: [faultType, confidence, probabilities, modelVersion]
      properties:
        faultType: {type: string}
        confidence: {type: number}
        probabilities: {type: object, additionalProperties: {type: number}}
        modelVersion: {type: string}
    FaultExplanation:
      type: object
      required: [faultType, confidence, modelVersion, baseValue, contributions]
      properties:
        faultType: {type: string}
        confidence: {type: number}
        modelVersion: {type: string}
        baseValue: {type: number}
        contributions:
          type: array
          items:
            type: object
            required: [feature, value, shap]
            properties:
              feature: {type: string}
              value: {type: number}
              shap: {type: number}
