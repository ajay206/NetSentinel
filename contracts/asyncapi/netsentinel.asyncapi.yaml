asyncapi: '3.0.0'
info:
  title: NetSentinel Alarm Stream
  version: '0.2.0'
  description: AsyncAPI contract for alarm messages produced by netgen-simulator and consumed by the API gateway.
servers:
  production:
    url: kafka:29092
    protocol: kafka
channels:
  alarms.raw:
    description: Raw alarm events emitted by the netgen-simulator.
    subscribe:
      message:
        $ref: '#/components/messages/Alarm'
    bindings:
      kafka:
        topic: alarms.raw
        partitions: 1
        replicas: 1
  kpis:
    description: KPI samples emitted by the netgen-simulator.
    publish:
      message:
        $ref: '#/components/messages/KpiSample'
    bindings:
      kafka:
        topic: kpis
        partitions: 1
        replicas: 1
components:
  messages:
    Alarm:
      name: Alarm
      title: Alarm
      summary: Alarm event following TMF642‑like structure.
      payload:
        type: object
        required:
          - id
          - href
          - alarmType
          - perceivedSeverity
          - probableCause
          - specificProblem
          - alarmedObject
          - siteId
          - alarmRaisedTime
          - state
          - sourceSystemId
        properties:
          id:
            type: string
            format: uuid
          href:
            type: string
          alarmType:
            type: string
          perceivedSeverity:
            type: string
            enum:
              - critical
              - major
              - minor
              - warning
              - cleared
          probableCause:
            type: string
          specificProblem:
            type: string
          alarmedObject:
            type: object
            required:
              - id
              - '@referredType'
            properties:
              id:
                type: string
              '@referredType':
                type: string
                enum:
                  - Site
          siteId:
            type: string
          alarmRaisedTime:
            type: string
            format: date-time
          state:
            type: string
            enum:
              - raised
              - cleared
          sourceSystemId:
            type: string
          '@type':
            type: string
            enum:
              - Alarm
    KpiSample:
      name: KpiSample
      title: KPI Sample
      summary: 15‑minute KPI sample per cell.
      payload:
        type: object
        required:
          - "@type"
          - sampleId
          - siteId
          - nodeId
          - cellId
          - region
          - timestamp
          - granularitySec
          - kpis
        properties:
          '@type':
            type: string
            const: KpiSample
          sampleId:
            type: string
            format: uuid
          siteId:
            type: string
          nodeId:
            type: string
          cellId:
            type: string
          region:
            type: string
            enum:
              - North
              - Central
              - South
          timestamp:
            type: string
            format: date-time
          granularitySec:
            type: integer
            minimum: 1
          kpis:
            type: object
            required:
              - dlThroughputMbps
              - prbUtilPct
              - rrcSetupSuccessPct
              - dropCallRatePct
              - availabilityPct
            properties:
              dlThroughputMbps:
                type: number
                minimum: 0
                maximum: 1000
              prbUtilPct:
                type: number
                minimum: 0
                maximum: 100
              rrcSetupSuccessPct:
                type: number
                minimum: 0
                maximum: 100
              dropCallRatePct:
                type: number
                minimum: 0
                maximum: 100
              availabilityPct:
                type: number
                minimum: 0
                maximum: 100
  schemas:
    placeholder: {}
  # Other components (securitySchemes, etc.) can be added later
  # TBD: other topics such as alarms.processed, metrics.raw
