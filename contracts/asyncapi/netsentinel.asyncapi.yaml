asyncapi: '3.0.0'
info:
  title: NetSentinel Alarm Stream
  version: '0.2.0'
  description: AsyncAPI contract for alarm messages produced by netgen-simulator and consumed by the API gateway.
servers:
  production:
    url: kafka:29092
    protocol: kafka
channels:
  alarms.raw:
    description: Raw alarm events emitted by the netgen-simulator.
    subscribe:
      message:
        $ref: '#/components/messages/Alarm'
    bindings:
      kafka:
        topic: alarms.raw
        partitions: 1
        replicas: 1
  alarms.enriched:
    description: >-
      Alarms after alarm-ingest (W4) - normalised, enriched with topology, deduplicated and
      correlated. Kafka key = siteId. At-least-once delivery (ADR-004).
    publish:
      message:
        $ref: '#/components/messages/EnrichedAlarm'
    bindings:
      kafka:
        topic: alarms.enriched
        partitions: 3
        replicas: 1
  kpis:
    description: >-
      KPI samples emitted by the netgen-simulator (key = cellId). Consumed by api-gateway
      (activity strip) and, from W5, by kpi-service (group kpi-service), which stores them in
      TimescaleDB idempotently on (cellId, timestamp) - see ADR-005.
    publish:
      message:
        $ref: '#/components/messages/KpiSample'
    bindings:
      kafka:
        topic: kpis
        partitions: 1
        replicas: 1
components:
  messages:
    Alarm:
      name: Alarm
      title: Alarm
      summary: Alarm event following TMF642‑like structure.
      payload:
        type: object
        required:
          - id
          - href
          - alarmType
          - perceivedSeverity
          - probableCause
          - specificProblem
          - alarmedObject
          - siteId
          - alarmRaisedTime
          - state
          - sourceSystemId
        properties:
          id:
            type: string
            format: uuid
          href:
            type: string
          alarmType:
            type: string
          perceivedSeverity:
            type: string
            enum:
              - critical
              - major
              - minor
              - warning
              - cleared
          probableCause:
            type: string
          specificProblem:
            type: string
          alarmedObject:
            type: object
            required:
              - id
              - '@referredType'
            properties:
              id:
                type: string
              '@referredType':
                type: string
                enum:
                  - Site
          siteId:
            type: string
          alarmRaisedTime:
            type: string
            format: date-time
          state:
            type: string
            enum:
              - raised
              - cleared
          sourceSystemId:
            type: string
          '@type':
            type: string
            enum:
              - Alarm
    EnrichedAlarm:
      name: EnrichedAlarm
      title: Enriched alarm
      summary: Alarm plus topology enrichment, dedup and correlation, produced by alarm-ingest.
      payload:
        allOf:
          - $ref: '#/components/messages/Alarm/payload'
          - type: object
            required: [ingestedAt, enrichment, dedup, correlation]
            properties:
              '@type':
                type: string
                const: EnrichedAlarm
              ingestedAt:
                type: string
                format: date-time
              enrichment:
                type: object
                required: [region, known, nodeTypes]
                properties:
                  siteName: {type: [string, 'null']}
                  region: {type: string, description: North, Central, South or Unknown}
                  siteKind: {type: [string, 'null'], enum: [core, hub, access, null]}
                  nodeTypes: {type: array, items: {type: string}}
                  parentSiteId: {type: [string, 'null']}
                  known: {type: boolean}
              dedup:
                type: object
                required: [key, count, firstSeen, isDuplicate]
                properties:
                  key: {type: string, description: 'siteId|alarmType|probableCause|specificProblem'}
                  count: {type: integer, minimum: 1}
                  firstSeen: {type: string, format: date-time}
                  isDuplicate: {type: boolean}
              correlation:
                type: object
                required: [groupId, rootSiteId, role]
                properties:
                  groupId: {type: [string, 'null']}
                  rootSiteId: {type: [string, 'null']}
                  role: {type: string, enum: [root, symptom, none]}
    KpiSample:
      name: KpiSample
      title: KPI Sample
      summary: 15‑minute KPI sample per cell.
      payload:
        type: object
        required:
          - "@type"
          - sampleId
          - siteId
          - nodeId
          - cellId
          - region
          - timestamp
          - granularitySec
          - kpis
        properties:
          '@type':
            type: string
            const: KpiSample
          sampleId:
            type: string
            format: uuid
          siteId:
            type: string
          nodeId:
            type: string
          cellId:
            type: string
          region:
            type: string
            enum:
              - North
              - Central
              - South
          timestamp:
            type: string
            format: date-time
          granularitySec:
            type: integer
            minimum: 1
          kpis:
            type: object
            required:
              - dlThroughputMbps
              - prbUtilPct
              - rrcSetupSuccessPct
              - dropCallRatePct
              - availabilityPct
            properties:
              dlThroughputMbps:
                type: number
                minimum: 0
                maximum: 1000
              prbUtilPct:
                type: number
                minimum: 0
                maximum: 100
              rrcSetupSuccessPct:
                type: number
                minimum: 0
                maximum: 100
              dropCallRatePct:
                type: number
                minimum: 0
                maximum: 100
              availabilityPct:
                type: number
                minimum: 0
                maximum: 100
  schemas:
    placeholder: {}
  # Other components (securitySchemes, etc.) can be added later
  # TBD: other topics such as alarms.processed, metrics.raw
