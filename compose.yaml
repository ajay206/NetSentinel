# Profiles and memory budget:
# core services (~1.5 GB total), UI profile adds ~192 MB, Sim profile adds ~256 MB,
# Pipeline profile (alarm-ingest ~160 MB + kpi-service ~192 MB) adds ~350 MB.
# The console runs in the `ui` profile (nginx on http://localhost:5173); `make console` is the
# optional native dev server. The `cli` profile is the tools image used by make/demo.sh, so the
# host needs only Docker, make and git. Every depends_on entry carries an explicit `condition`.
# Fixed project name, so volumes are always netsentinel_<name> (see `make reset-db`).
name: netsentinel

services:
  kafka:
    image: apache/kafka:3.8.0
    # Also in every profile whose services depend on it, so any profile combination is valid.
    profiles: ["core", "ui", "pipeline", "sim", "ops"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    # ui: the gateway keeps users + audit_log here (13b); ops: ticket-service tables (W16)
    profiles: ["core", "pipeline", "ui", "ops"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    mem_limit: 512m
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: netsentinel-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    profiles: ["ui"]
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ALARM_TOPIC: alarms.raw
      KPI_TOPIC: kpis
      ENRICHED_TOPIC: alarms.enriched
      KPI_SERVICE_URL: http://kpi-service:8002
      ML_SERVICE_URL: http://ml-service:8003
      RAG_SERVICE_URL: http://rag-service:8004
      COPILOT_URL: http://copilot-orchestrator:8005
      TOPOLOGY_SEED: "42"
      TOPOLOGY_FULL: "0"
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      CORS_ORIGINS: "http://localhost:5173"
      DISABLE_KAFKA: "0"
      ALARM_INGEST_URL: http://alarm-ingest:8001
      MCP_SERVER_URL: http://mcp-server:8006
      INCIDENT_SERVICE_URL: http://incident-service:8007
      TOPOLOGY_SERVICE_URL: http://topology-service:8008
      TICKET_SERVICE_URL: http://ticket-service:8009
      TICKET_SERVICE_TOKEN: ${TICKET_SERVICE_TOKEN:-dev-only-ticket-token}
      # W11: JWT/RBAC. Dev-only defaults; set real values in .env (never commit them)
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdefghij}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-only-service-token}
      DEMO_USERS: "1"
      RATE_LIMIT_PER_MIN: "600"
      # Step 13b: users + audit_log in TimescaleDB (bcrypt hashes; demo users seeded on first run)
      USER_STORE: ${USER_STORE:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOCKOUT_SECONDS: ${LOCKOUT_SECONDS:-900}
      # Step 21: PQC status panel probes these with real hybrid / classical handshakes
      PQC_TLS_TARGETS: llm-gateway=llm-gateway:8443
      PQC_CA_FILE: /pqc/ca.crt
    volumes:
      - pqc:/pqc:ro
    mem_limit: 192m
    depends_on:
      pqc-init:
        condition: service_completed_successfully
        required: false
      kafka:
        condition: service_healthy
        required: false
      timescaledb:
        condition: service_healthy
        required: false
    restart: unless-stopped

  noc-console:
    build:
      context: apps/noc-console
    profiles: ["ui"]
    ports:
      - "5173:80"
    mem_limit: 64m
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

  alarm-ingest:
    build:
      context: .
      dockerfile: services/alarm-ingest/Dockerfile
    profiles: ["pipeline"]
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      RAW_TOPIC: alarms.raw
      ENRICHED_TOPIC: alarms.enriched
      TOPOLOGY_SEED: "42"
      TOPOLOGY_FULL: "0"
    mem_limit: 160m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  incident-service:
    build:
      context: .
      dockerfile: services/incident-service/Dockerfile
    profiles: ["ops"]
    ports:
      - "8007:8007"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ENRICHED_TOPIC: alarms.enriched
      INCIDENTS_TOPIC: incidents
      TOPOLOGY_SEED: "42"
      TOPOLOGY_FULL: "0"
      INCIDENT_GAP_SECONDS: "300"
      INCIDENT_MAX_HOPS: "4"
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8007/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # W16: ticket drafts + human approvals + append-only audit log (Postgres via Alembic)
  ticket-service:
    build:
      context: .
      dockerfile: services/ticket-service/Dockerfile
    profiles: ["ops"]
    ports:
      - "127.0.0.1:8009:8009"  # local only; reached through the gateway
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@timescaledb:5432/postgres
      # Only the gateway knows this token, so X-NS-User / X-NS-Role cannot be forged
      TICKET_SERVICE_TOKEN: ${TICKET_SERVICE_TOKEN:-dev-only-ticket-token}
    mem_limit: 128m
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8009/readyz')\""]
      interval: 10s
      retries: 6
    restart: unless-stopped

  # Step 14 (W14): network knowledge graph. ~1 GB total, opt-in: --profile graph
  neo4j:
    image: neo4j:5.26-community  # multi-arch (amd64 + arm64)
    profiles: ["graph"]
    ports:
      - "127.0.0.1:7474:7474"  # browser, local only
      - "127.0.0.1:7687:7687"  # bolt, local only
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-graph}
      # Modest caps for 8 GB laptops: 512 MB heap + 256 MB page cache (graph is tiny)
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
      NEO4J_dbms_usage__report_enabled: "false"
    mem_limit: 1g
    volumes:
      - neo4j-data:/data
    healthcheck:
      # no curl/wget in the image; bolt accepts connections once the database is up
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7687"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  topology-service:
    build:
      context: .
      dockerfile: services/topology-service/Dockerfile
    profiles: ["graph"]
    ports:
      - "8008:8008"
    environment:
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-graph}
      # same synthetic topology as incident-service / the console (netgen, deterministic)
      TOPOLOGY_SEED: "42"
      TOPOLOGY_FULL: "0"
      RUNBOOKS_DIR: /app/data/runbooks
      # Mirror live enriched alarms into the graph when Kafka is up (core profile): set to 0
      DISABLE_KAFKA: ${TOPOLOGY_DISABLE_KAFKA:-1}
      KAFKA_BOOTSTRAP: kafka:29092
      ENRICHED_TOPIC: alarms.enriched
    mem_limit: 192m
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8008/readyz')\""]
      interval: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  kpi-service:
    build:
      context: .
      dockerfile: services/kpi-service/Dockerfile
    profiles: ["pipeline"]
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KPI_TOPIC: kpis
      KPI_STORE: postgres
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    mem_limit: 192m
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    profiles: ["pipeline"]
    ports:
      - "8003:8003"
    environment:
      KPI_SERVICE_URL: http://kpi-service:8002
      ANOMALY_Z: "3.5"
      MODELS_DIR: /tmp/models
      AUTO_TRAIN: "1"
      # Step 21: ML-DSA-65 signature checked before the model loads; tampered = refused (503).
      # Dev only: the auto-trained model is signed with pqc-init's release key.
      MODEL_VERIFY: ${MODEL_VERIFY:-enforce}
      MODEL_SIGNING_PUBKEY: /pqc/model-signing.pub
      MODEL_SIGNING_KEY: /pqc/model-signing.key
    volumes:
      - pqc:/pqc:ro
    mem_limit: 256m
    depends_on:
      pqc-init:
        condition: service_completed_successfully
      kpi-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8003/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["rag"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 384m
    restart: unless-stopped

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    profiles: ["rag"]
    ports:
      - "8004:8004"
    environment:
      QDRANT_URL: http://qdrant:6333
      RUNBOOKS_DIR: /app/data/runbooks
      # "fastembed" = bge-small-en-v1.5: needs the embed extra and ~512m mem_limit
      EMBEDDER: hash
      # Step 15 Graph RAG: graph context from topology-service (profile "graph"); when it is
      # not running, rag-service falls back to the in-process seed-42 topology (same shape)
      GRAPH_CONTEXT: http
      TOPOLOGY_SERVICE_URL: http://topology-service:8008
    mem_limit: 256m
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8004/readyz')\""]
      interval: 10s
      retries: 6
    restart: unless-stopped

  copilot-orchestrator:
    build:
      context: .
      dockerfile: services/copilot-orchestrator/Dockerfile
    profiles: ["copilot"]
    ports:
      - "8005:8005"
    environment:
      GATEWAY_URL: http://api-gateway:8000
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-only-service-token}
      ML_SERVICE_URL: http://ml-service:8003
      RAG_SERVICE_URL: http://rag-service:8004
      # Step 15: graph (Graph RAG, node-ID citations) | hybrid (W8 retrieval)
      RAG_MODE: graph
      # Step 17: LangGraph agents start on incident.created (topic `incidents`, core + ops
      # profiles); runs pause at the human approval node. "off" = only on demand.
      AGENT_TRIGGER: ${AGENT_TRIGGER:-kafka}
      KAFKA_BOOTSTRAP: kafka:29092
      INCIDENTS_TOPIC: incidents
      # Optional Langfuse tracing (self-hosted); unset = console trace view only
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Step 18: every model call goes through llm-gateway; "off" = deterministic fallback only
      LLM: ${LLM:-gateway}
      # Step 21: TLS 1.3 to llm-gateway, which only accepts hybrid X25519MLKEM768. The client
      # offers hybrid first and keeps X25519 for external HTTPS (e.g. Langfuse).
      LLM_GATEWAY_URL: https://llm-gateway:8443
      LLM_GATEWAY_CA: /pqc/ca.crt
      OPENSSL_CONF: /etc/netsentinel/pqc/openssl-hybrid-pref.cnf
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-dev-only-llm-token}
      # W10: evidence via MCP tools (TOOLS=http = direct W9 calls)
      TOOLS: mcp
      MCP_URL: http://mcp-server:8006/mcp
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-dev-only-change-me}
    volumes:
      - pqc:/pqc:ro
    mem_limit: 192m
    depends_on:
      mcp-server:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8005/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  pqc-init:
    # Step 21: one-shot, idempotent: dev CA + llm-gateway cert + ML-DSA-65 model-signing key
    build:
      context: .
      dockerfile: infra/pqc/Dockerfile
    profiles: ["ui", "pipeline", "copilot"]
    volumes:
      - pqc:/pqc
    mem_limit: 128m
    restart: "no"

  llm-gateway:
    build:
      context: .
      dockerfile: services/llm-gateway/Dockerfile
    profiles: ["copilot"]
    # Step 18: the only service allowed to reach a model. Internal only (no published port).
    # Step 21: HTTPS on 8443, hybrid-only key exchange (classical-only clients are refused).
    expose:
      - "8443"
    environment:
      LLM_GATEWAY_TLS_CERT: /pqc/llm-gateway.crt
      LLM_GATEWAY_TLS_KEY: /pqc/llm-gateway.key
      OPENSSL_CONF: /etc/netsentinel/pqc/openssl-hybrid.cnf
      # Ordered routes: local SLM first, cloud stub until Phase 3 (telcogpt-mini later)
      LLM_ROUTES: ${LLM_ROUTES:-ollama:qwen2.5:1.5b,cloud:stub}
      # Ollama runs natively on the Mac (Metal)
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_TIMEOUT_S: "60"
      LLM_BREAKER_FAILURES: "3"
      LLM_BREAKER_COOLDOWN_S: "30"
      # name:token:requests-per-minute, comma separated
      LLM_GATEWAY_CALLERS: copilot-orchestrator:${LLM_GATEWAY_TOKEN:-dev-only-llm-token}:30
      LLM_CALLER_CONCURRENCY: "2"
      PII_ENGINE: regex
    volumes:
      - pqc:/pqc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 128m
    depends_on:
      pqc-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request;urllib.request.urlopen('https://localhost:8443/health',context=ssl.create_default_context(cafile='/pqc/ca.crt'))\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    profiles: ["copilot"]
    # Internal only: no published ports, so only containers on the compose network (the
    # copilot) can reach it, and every /mcp call needs the service token.
    expose:
      - "8006"
    environment:
      GATEWAY_URL: http://api-gateway:8000
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-only-service-token}
      ML_SERVICE_URL: http://ml-service:8003
      RAG_SERVICE_URL: http://rag-service:8004
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-dev-only-change-me}
      # Host headers accepted by FastMCP's DNS-rebinding protection (else 421 Invalid Host header)
      MCP_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,mcp-server:*"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8006/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  netgen-simulator:
    build:
      context: .
      dockerfile: services/netgen-simulator/Dockerfile
    profiles: ["sim"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  netgen-kpis:
    build:
      context: .
      dockerfile: services/netgen-simulator/Dockerfile
    profiles: ["sim"]
    command: ["kpis","--seed","42","--days","1","--follow","--interval","5"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # CLI tools (netgen-sim, smoke test, gateway helper): `docker compose --profile cli run --rm tools`
  tools:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    profiles: ["cli"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      GATEWAY_URL: http://api-gateway:8000
      CONSOLE_URL: http://noc-console
      # Step 13b smoke roles/password checks (synthetic demo users; override if changed)
      SMOKE_VIEWER_PASSWORD: ${SMOKE_VIEWER_PASSWORD:-viewer}
      SMOKE_OPERATOR_PASSWORD: ${SMOKE_OPERATOR_PASSWORD:-operator}
      SMOKE_ADMIN_PASSWORD: ${SMOKE_ADMIN_PASSWORD:-admin}
      # Step 14: graph_impact check. auto = run if the graph profile is up, 1 = required, 0 = skip
      SMOKE_GRAPH: ${SMOKE_GRAPH:-auto}
    mem_limit: 192m
    restart: "no"

volumes:
  kafka-data: {}
  qdrant-data: {}
  pg-data: {}
  neo4j-data: {}
  pqc: {}
