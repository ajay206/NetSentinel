# Profiles and memory budget:
# core services (~1.5 GB total), UI profile adds ~192 MB, Sim profile adds ~256 MB,
# Pipeline profile (alarm-ingest ~160 MB + kpi-service ~192 MB) adds ~350 MB.
# The console runs natively on the host and is not containerized.
services:
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["core"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles: ["core"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    mem_limit: 512m
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: netsentinel-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    profiles: ["ui"]
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ALARM_TOPIC: alarms.raw
      KPI_TOPIC: kpis
      ENRICHED_TOPIC: alarms.enriched
      KPI_SERVICE_URL: http://kpi-service:8002
      ML_SERVICE_URL: http://ml-service:8003
      RAG_SERVICE_URL: http://rag-service:8004
      COPILOT_URL: http://copilot-orchestrator:8005
      TOPOLOGY_SEED: "42"
      TOPOLOGY_FULL: "0"
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      CORS_ORIGINS: "http://localhost:5173"
      DISABLE_KAFKA: "0"
      ALARM_INGEST_URL: http://alarm-ingest:8001
      # W11: JWT/RBAC. Dev-only defaults; set real values in .env (never commit them)
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdefghij}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-only-service-token}
      DEMO_USERS: "1"
      RATE_LIMIT_PER_MIN: "600"
    mem_limit: 192m
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      timescaledb:
        required: false
    restart: unless-stopped

  alarm-ingest:
    build:
      context: .
      dockerfile: services/alarm-ingest/Dockerfile
    profiles: ["pipeline"]
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      RAW_TOPIC: alarms.raw
      ENRICHED_TOPIC: alarms.enriched
      TOPOLOGY_SEED: "42"
      TOPOLOGY_FULL: "0"
    mem_limit: 160m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  kpi-service:
    build:
      context: .
      dockerfile: services/kpi-service/Dockerfile
    profiles: ["pipeline"]
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KPI_TOPIC: kpis
      KPI_STORE: postgres
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    mem_limit: 192m
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8002/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    profiles: ["pipeline"]
    ports:
      - "8003:8003"
    environment:
      KPI_SERVICE_URL: http://kpi-service:8002
      ANOMALY_Z: "3.5"
      MODELS_DIR: /tmp/models
      AUTO_TRAIN: "1"
    mem_limit: 256m
    depends_on:
      kpi-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8003/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["rag"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 384m
    restart: unless-stopped

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    profiles: ["rag"]
    ports:
      - "8004:8004"
    environment:
      QDRANT_URL: http://qdrant:6333
      RUNBOOKS_DIR: /app/data/runbooks
      # "fastembed" = bge-small-en-v1.5: needs the embed extra and ~512m mem_limit
      EMBEDDER: hash
    mem_limit: 256m
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8004/readyz')\""]
      interval: 10s
      retries: 6
    restart: unless-stopped

  copilot-orchestrator:
    build:
      context: .
      dockerfile: services/copilot-orchestrator/Dockerfile
    profiles: ["copilot"]
    ports:
      - "8005:8005"
    environment:
      GATEWAY_URL: http://api-gateway:8000
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-only-service-token}
      ML_SERVICE_URL: http://ml-service:8003
      RAG_SERVICE_URL: http://rag-service:8004
      # Ollama runs natively on the Mac (Metal); "off" = deterministic fallback answers only
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      LLM: ollama
      # W10: evidence via MCP tools (TOOLS=http = direct W9 calls)
      TOOLS: mcp
      MCP_URL: http://mcp-server:8006/mcp
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-dev-only-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 192m
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8005/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    profiles: ["copilot"]
    # Internal only: no published ports, so only containers on the compose network (the
    # copilot) can reach it, and every /mcp call needs the service token.
    expose:
      - "8006"
    environment:
      GATEWAY_URL: http://api-gateway:8000
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev-only-service-token}
      ML_SERVICE_URL: http://ml-service:8003
      RAG_SERVICE_URL: http://rag-service:8004
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-dev-only-change-me}
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8006/healthz')\""]
      interval: 10s
      retries: 5
    restart: unless-stopped

  netgen-simulator:
    build:
      context: .
      dockerfile: services/netgen-simulator/Dockerfile
    profiles: ["sim"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  netgen-kpis:
    build:
      context: .
      dockerfile: services/netgen-simulator/Dockerfile
    profiles: ["sim"]
    command: ["kpis","--seed","42","--days","1","--follow","--interval","5"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  kafka-data: {}
  qdrant-data: {}
  pg-data: {}
