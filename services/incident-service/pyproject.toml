[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-service"
version = "0.1.0"
description = "Topology-aware alarm clustering into incidents (W13)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiokafka>=0.11",
    "netgen",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.uv.sources]
netgen = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/incident_service"]

[project.scripts]
incident-eval = "incident_service.evaluate:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
