[alembic]
script_location = %(here)s/migrations
# DATABASE_URL (env) overrides this; see migrations/env.py
sqlalchemy.url = sqlite:///./tickets.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
