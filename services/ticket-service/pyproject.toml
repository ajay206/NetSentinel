[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-service"
version = "0.1.0"
description = "Ticket drafts, human approval workflow and append-only audit log (W16)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
