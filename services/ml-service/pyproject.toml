[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-service"
version = "0.1.0"
description = "NetSentinel ml-service: statistical anomaly baselines (W6)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ns-pqc",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "xgboost>=2.1",
    "netgen",
]

[project.optional-dependencies]
mlflow = ["mlflow-skinny>=2.16"]

[project.scripts]
ml-train-baselines = "ml_service.train_baselines:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]

[tool.uv.sources]
ns-pqc = { workspace = true }
netgen = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
