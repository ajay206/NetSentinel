{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "ns.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  {{- if not (and $app.hpa $app.hpa.enabled) }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: netsentinel}
    spec:
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $name }}
          image: {{ include "ns.image" (list $ $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{containerPort: {{ $app.port }}, name: http}]
          securityContext: {allowPrivilegeEscalation: false}
          env:
            {{- range $k, $v := $app.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            {{- range $k, $key := ($app.secretEnv | default dict) }}
            - name: {{ $k }}
              valueFrom: {secretKeyRef: {name: netsentinel-secrets, key: {{ $key }}}}
            {{- end }}
          readinessProbe:
            httpGet: {path: {{ $app.probe }}, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: {{ $app.probe }}, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml $app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "ns.labels" $ | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports: [{name: http, port: {{ if eq $name "noc-console" }}80{{ else }}{{ $app.port }}{{ end }}, targetPort: http}]
{{- if and $app.hpa $app.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "ns.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ $app.hpa.minReplicas }}
  maxReplicas: {{ $app.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $app.hpa.cpuPercent }}}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 60}
{{- end }}
{{- end }}
{{- end }}
