[project]
name = "netsentinel"
version = "0.1.0"
description = "AI-assisted NOC copilot for telecom networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "ns-common",
    "netgen",
    "netgen-simulator",
    "api-gateway",
    "alarm-ingest",
    "kpi-service",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
ns-common = { workspace = true }
netgen = { workspace = true }
netgen-simulator = { workspace = true }
api-gateway = { workspace = true }
alarm-ingest = { workspace = true }
kpi-service = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
