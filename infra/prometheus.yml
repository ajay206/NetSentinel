# W22: Prometheus (compose profile `obs`). Short retention keeps it light on an 8 GB Mac.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
